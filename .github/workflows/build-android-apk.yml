name: Build InovaPro Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile_bundle.b64
      - .github/workflows/build-android-apk.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_BACKEND_URL: "https://inovapro-api-runtime-production.up.railway.app"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;27.1.12297006"             "cmake;3.22.1"

      - name: Restore mobile source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d mobile_bundle.b64 > /tmp/inovapro-mobile.zip
          mkdir -p "$GITHUB_WORKSPACE/mobile-src"
          unzip -q /tmp/inovapro-mobile.zip -d "$GITHUB_WORKSPACE/mobile-src"
          test -f "$GITHUB_WORKSPACE/mobile-src/inovapro/frontend/package.json"

      - name: Install dependencies
        working-directory: mobile-src/inovapro/frontend
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Validate unit tests
        working-directory: mobile-src/inovapro/frontend
        run: yarn test:unit

      - name: Generate Android native project
        working-directory: mobile-src/inovapro/frontend
        run: npx expo prebuild --platform android --clean

      - name: Build standalone APK
        working-directory: mobile-src/inovapro/frontend/android
        shell: bash
        run: |
          set -euo pipefail
          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/mobile-src/inovapro/frontend/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InovaPro-Standalone-APK
          path: mobile-src/inovapro/frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
